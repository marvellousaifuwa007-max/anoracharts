<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anoracharts</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #ffffff;
    }

    header {
      background: #000000;
      border-bottom: 1px solid #242424;
      padding: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #fff;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 80px;
    }

    .eyebrow {
      color: #999;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
      letter-spacing: -1.5px;
    }

    .description {
      color: #999;
      margin: 0 0 35px;
      font-size: 15px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .controls label {
      color: #999;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    select {
      background: #151515;
      color: white;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 35px 10px 12px;
      font-size: 14px;
    }

    .status {
      background: #111;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 13px 15px;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #252525;
      border-radius: 8px;
      background: #0d0d0d;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    thead {
      background: #151515;
    }

    th {
      text-align: left;
      color: #777;
      font-size: 11px;
      letter-spacing: 1px;
      padding: 14px 12px;
      border-bottom: 1px solid #292929;
      white-space: nowrap;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #1d1d1d;
      font-size: 14px;
    }

    tbody tr:hover {
      background: #151515;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .rank {
      width: 55px;
      font-weight: 800;
    }

    .song {
      font-weight: 700;
      color: #fff;
    }

    .artist {
      color: #aaa;
    }

    .muted {
      color: #666;
    }

    .movement {
      font-weight: 700;
      white-space: nowrap;
    }

    .up {
      color: #54d66a;
    }

    .down {
      color: #ff5b5b;
    }

    .new {
      color: #fff;
    }

    .peak,
    .weeks,
    .points {
      white-space: nowrap;
    }

    footer {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 50px;
      color: #555;
      font-size: 12px;
    }

    .error {
      color: #ff6b6b;
    }

    @media (max-width: 700px) {
      main {
        padding-top: 30px;
      }

      h1 {
        font-size: 32px;
      }

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">Anoracharts</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Hot 100</a>
      <a href="#">Albums</a>
      <a href="#">Artists</a>
      <a href="#">Awards</a>
      <a href="#">Records</a>
    </nav>
  </div>
</header>

<main>

  <div class="eyebrow">WEEKLY MUSIC CHARTS</div>

  <h1>Hot 100</h1>

  <p class="description">
    The biggest songs on Anoracharts based on your personal listening data.
  </p>

  <div class="controls">
    <label for="weekSelect">CHART WEEK</label>

    <select id="weekSelect">
      <option value="">Loading...</option>
    </select>
  </div>

  <div id="status" class="status">
    Loading chart data...
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>RANK</th>
          <th>PREV</th>
          <th>MOVE</th>
          <th>SONG</th>
          <th>ARTIST</th>
          <th>PEAK</th>
          <th>WEEKS</th>
          <th>POINTS</th>
        </tr>
      </thead>

      <tbody id="chartBody">
        <tr>
          <td colspan="8" class="muted">
            Loading chart...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<footer>
  © 2026 Anoracharts
</footer>

<script>

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzQgIvarGlH-2djciFMSbGJpX17-c5XCvPJo4qS3avuxJx7tqqTpONeOR1fzrGnQZ4J9w/exec";


  const weekSelect = document.getElementById("weekSelect");
  const chartBody = document.getElementById("chartBody");
  const statusBox = document.getElementById("status");


  function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function getRows(data) {

    if (Array.isArray(data)) {
      return data;
    }

    if (data && Array.isArray(data.data)) {
      return data.data;
    }

    if (data && Array.isArray(data.rows)) {
      return data.rows;
    }

    return [];
  }


  function getValue(row, possibleNames) {

    for (const name of possibleNames) {

      if (
        row &&
        Object.prototype.hasOwnProperty.call(row, name) &&
        row[name] !== null &&
        row[name] !== undefined
      ) {
        return row[name];
      }

    }

    return "";
  }


  function getRank(row, index) {

    const value = getValue(row, [
      "rank",
      "Rank",
      "#",
      "position",
      "Position"
    ]);

    return value || index + 1;
  }


  function getSong(row) {

    return getValue(row, [
      "song",
      "Song",
      "title",
      "Title",
      "track",
      "Track"
    ]);
  }


  function getArtist(row) {

    return getValue(row, [
      "artist",
      "Artist",
      "artists",
      "Artists"
    ]);
  }


  function getPrevious(row) {

    return getValue(row, [
      "prev",
      "Prev",
      "previous",
      "Previous",
      "previousRank",
      "Previous Rank"
    ]);
  }


  function getPeak(row) {

    return getValue(row, [
      "peak",
      "Peak"
    ]);
  }


  function getWeeks(row) {

    return getValue(row, [
      "weeks",
      "Weeks",
      "weeksOnChart",
      "Weeks on Chart"
    ]);
  }


  function getPoints(row) {

    return getValue(row, [
      "points",
      "Points",
      "weeklyPoints",
      "Weekly Points"
    ]);
  }


  function movementHTML(rank, previous) {

    if (
      previous === "" ||
      previous === null ||
      previous === undefined
    ) {
      return '<span class="new">NEW</span>';
    }

    const current = Number(rank);
    const old = Number(previous);

    if (
      !Number.isFinite(current) ||
      !Number.isFinite(old)
    ) {
      return '<span class="muted">—</span>';
    }

    if (old === current) {
      return '<span class="muted">—</span>';
    }

    const difference = old - current;

    if (difference > 0) {
      return '<span class="up">▲ ' + difference + '</span>';
    }

    return '<span class="down">▼ ' + Math.abs(difference) + '</span>';
  }


  function renderChart(data) {

    const rows = getRows(data);

    chartBody.innerHTML = "";

    if (!rows.length) {

      chartBody.innerHTML = `
        <tr>
          <td colspan="8" class="muted">
            No chart data found.
          </td>
        </tr>
      `;

      return;
    }


    rows.forEach((row, index) => {

      const rank = getRank(row, index);
      const song = getSong(row);
      const artist = getArtist(row);
      const previous = getPrevious(row);
      const peak = getPeak(row);
      const weeks = getWeeks(row);
      const points = getPoints(row);

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td class="rank">${escapeHTML(rank)}</td>

        <td>
          ${
            previous !== ""
              ? escapeHTML(previous)
              : '<span class="muted">—</span>'
          }
        </td>

        <td class="movement">
          ${movementHTML(rank, previous)}
        </td>

        <td class="song">
          ${escapeHTML(song)}
        </td>

        <td class="artist">
          ${escapeHTML(artist)}
        </td>

        <td class="peak">
          ${
            peak !== ""
              ? escapeHTML(peak)
              : '<span class="muted">—</span>'
          }
        </td>

        <td class="weeks">
          ${
            weeks !== ""
              ? escapeHTML(weeks)
              : '<span class="muted">—</span>'
          }
        </td>

        <td class="points">
          ${
            points !== ""
              ? escapeHTML(points)
              : '<span class="muted">—</span>'
          }
        </td>
      `;

      chartBody.appendChild(tr);
    });


    const week =
      data.week ||
      data.Week ||
      "";

    const count =
      data.count ||
      rows.length;

    statusBox.textContent =
      "Chart week: " +
      (week || "Current") +
      " • " +
      count +
      " songs";
  }


  async function fetchAPI(params = "") {

    const separator = params ? "?" : "";

    const response = await fetch(
      API_URL + separator + params,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "API request failed: " + response.status
      );
    }

    return await response.json();
  }


  async function loadChart(week = "") {

    statusBox.textContent =
      "Loading chart data...";

    chartBody.innerHTML = `
      <tr>
        <td colspan="8" class="muted">
          Loading chart...
        </td>
      </tr>
    `;

    try {

      let query =
        "chart=hot100";

      if (week) {
        query +=
          "&week=" +
          encodeURIComponent(week);
      }

      const data =
        await fetchAPI(query);

      renderChart(data);

    } catch (error) {

      console.error(error);

      statusBox.innerHTML =
        '<span class="error">' +
        'Unable to load chart data.' +
        '</span>';

      chartBody.innerHTML = `
        <tr>
          <td colspan="8" class="error">
            ${escapeHTML(error.message)}
          </td>
        </tr>
      `;
    }
  }


  async function loadWeeks() {

    try {

      const data =
        await fetchAPI("chart=hot100");

      const weeks =
        Array.isArray(data.availableWeeks)
          ? data.availableWeeks
          : [];

      weekSelect.innerHTML = "";

      if (!weeks.length) {

        const option =
          document.createElement("option");

        option.value = "";

        option.textContent =
          data.week || "Latest week";

        weekSelect.appendChild(option);

        return;
      }


      weeks
        .slice()
        .reverse()
        .forEach(week => {

          const option =
            document.createElement("option");

          option.value = week;

          option.textContent = formatWeek(week);

          weekSelect.appendChild(option);
        });


      if (data.week) {
        weekSelect.value = data.week;
      }

    } catch (error) {

      console.error(
        "Could not load weeks:",
        error
      );

      weekSelect.innerHTML = `
        <option value="">
          Latest week
        </option>
      `;
    }
  }


  function formatWeek(value) {

    if (!value) {
      return "Latest week";
    }

    const date =
      new Date(value + "T00:00:00");

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );
  }


  weekSelect.addEventListener(
    "change",
    function () {

      loadChart(
        weekSelect.value
      );

    }
  );


  async function start() {

    await loadWeeks();

    await loadChart(
      weekSelect.value
    );

  }


  start();

</script>

</body>
</html>
