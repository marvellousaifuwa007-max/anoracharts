<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Anoracharts — Personal Music Charts</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      background: #000;
      border-bottom: 1px solid #292929;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1400px;
      margin: auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo span {
      color: #aaa;
    }

    nav {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    nav a {
      color: #aaa;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    /* MAIN */

    main {
      max-width: 1400px;
      margin: auto;
      padding: 45px 22px 80px;
    }

    .hero {
      margin-bottom: 35px;
    }

    .eyebrow {
      color: #888;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 76px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 15px;
    }

    .description {
      color: #999;
      font-size: 16px;
      max-width: 700px;
      line-height: 1.6;
    }

    /* CONTROLS */

    .controls {
      background: #111;
      border: 1px solid #272727;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .control-label {
      color: #777;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 6px;
    }

    select {
      background: #000;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 7px;
      padding: 11px 35px 11px 12px;
      font-size: 14px;
      min-width: 210px;
      outline: none;
    }

    select:focus {
      border-color: #777;
    }

    .week-info {
      color: #aaa;
      font-size: 13px;
    }

    .week-info strong {
      color: #fff;
    }

    /* STATUS */

    .status {
      padding: 16px;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .status.loading {
      display: block;
      background: #111;
      border: 1px solid #292929;
      color: #aaa;
    }

    .status.error {
      display: block;
      background: #190d0d;
      border: 1px solid #4b2020;
      color: #ff9a9a;
    }

    /* CHART */

    .chart-container {
      background: #0d0d0d;
      border: 1px solid #242424;
      border-radius: 12px;
      overflow: hidden;
    }

    .chart-header {
      padding: 20px;
      border-bottom: 1px solid #242424;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .chart-title {
      font-size: 20px;
      font-weight: 900;
    }

    .chart-date {
      color: #888;
      font-size: 13px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th {
      background: #111;
      color: #777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      text-align: left;
      padding: 13px 12px;
      border-bottom: 1px solid #292929;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #1c1c1c;
      font-size: 14px;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #141414;
    }

    .rank {
      width: 60px;
      font-size: 17px;
      font-weight: 900;
    }

    .previous {
      width: 70px;
      color: #888;
      font-size: 13px;
    }

    .movement {
      width: 75px;
      font-weight: 900;
    }

    .up {
      color: #69d98c;
    }

    .down {
      color: #ff7777;
    }

    .same {
      color: #777;
    }

    .new {
      color: #fff;
      font-size: 10px;
      letter-spacing: .5px;
      background: #333;
      padding: 4px 7px;
      border-radius: 4px;
    }

    .song-cell {
      min-width: 280px;
    }

    .song-title {
      color: #fff;
      font-weight: 800;
      text-transform: none;
      margin-bottom: 4px;
    }

    .artist-name {
      color: #777;
      font-size: 12px;
    }

    .peak {
      font-weight: 800;
    }

    .weeks {
      color: #aaa;
    }

    .points {
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid #222;
      padding: 30px 22px;
      color: #666;
      font-size: 12px;
      text-align: center;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        width: 100%;
      }

      main {
        padding: 32px 14px 60px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .controls {
        align-items: stretch;
      }

      select {
        width: 100%;
      }

      .chart-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <a href="#" class="logo">
      Anora<span>charts</span>
    </a>

    <nav>
      <a href="#" class="active">Home</a>
      <a href="#hot100">Hot 100</a>
      <a href="#albums">Albums</a>
      <a href="#artists">Artists</a>
      <a href="#awards">Awards</a>
      <a href="#records">Records</a>
    </nav>

  </div>
</header>


<main>

  <section class="hero">

    <div class="eyebrow">
      Weekly Music Charts
    </div>

    <h1>Hot 100</h1>

    <p class="description">
      The biggest songs on Anoracharts based on your personal listening data.
    </p>

  </section>


  <section class="controls">

    <div>
      <label class="control-label" for="weekSelect">
        Chart Week
      </label>

      <select id="weekSelect">
        <option>Loading weeks...</option>
      </select>
    </div>

    <div class="week-info" id="weekInfo">
      Loading chart data...
    </div>

  </section>


  <div id="status" class="status"></div>


  <section class="chart-container">

    <div class="chart-header">

      <div class="chart-title">
        Anoracharts Hot 100
      </div>

      <div class="chart-date" id="chartDate">
        —
      </div>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Rank</th>
            <th>Prev</th>
            <th>Move</th>
            <th>Song</th>
            <th>Peak</th>
            <th>Weeks</th>
            <th style="text-align:right;">Points</th>
          </tr>

        </thead>

        <tbody id="chartBody"></tbody>

      </table>

    </div>

  </section>

</main>


<footer>
  © Anoracharts — Personal Music Charts
</footer>


<script>

  /*
   * ============================================================
   * ANORACHARTS API
   * ============================================================
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbzQgIvarGlH-2djciFMSbGJpX17-c5XCvPJo4qS3avuxJx7tqqTpONeOR1fzrGnQZ4J9w/exec";


  /*
   * ============================================================
   * ELEMENTS
   * ============================================================
   */

  const weekSelect = document.getElementById("weekSelect");
  const chartBody = document.getElementById("chartBody");
  const statusBox = document.getElementById("status");
  const weekInfo = document.getElementById("weekInfo");
  const chartDate = document.getElementById("chartDate");


  /*
   * ============================================================
   * HELPERS
   * ============================================================
   */

  function showLoading(message = "Loading chart...") {

    statusBox.className = "status loading";
    statusBox.textContent = message;

  }


  function showError(message) {

    statusBox.className = "status error";
    statusBox.textContent = message;

  }


  function hideStatus() {

    statusBox.className = "status";

  }


  function cleanText(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value).trim();

  }


  function escapeHTML(value) {

    return cleanText(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function numberValue(value) {

    if (typeof value === "number") {
      return value;
    }

    const cleaned = cleanText(value)
      .replace(/,/g, "")
      .replace(/[^\d.-]/g, "");

    const number = Number(cleaned);

    return Number.isFinite(number) ? number : 0;

  }


  function formatNumber(value) {

    return numberValue(value).toLocaleString("en-US");

  }


  /*
   * ============================================================
   * MOVEMENT
   * ============================================================
   */

  function getMovement(rank, previous) {

    const current = numberValue(rank);
    const prev = numberValue(previous);

    if (!prev || prev <= 0) {

      return {
        text: "NEW",
        className: "new"
      };

    }

    if (current < prev) {

      return {
        text: "▲ " + (prev - current),
        className: "up"
      };

    }

    if (current > prev) {

      return {
        text: "▼ " + (current - prev),
        className: "down"
      };

    }

    return {
      text: "—",
      className: "same"
    };

  }


  /*
   * ============================================================
   * PEAK
   *
   * Your API can return values such as:
   *
   * 1
   * 6x
   *
   * We display this cleanly as:
   *
   * #1
   * 6x at #1
   * ============================================================
   */

  function formatPeak(value) {

    const raw = cleanText(value);

    if (!raw) {
      return "—";
    }

    const parts = raw
      .split(/\r?\n/)
      .map(x => x.trim())
      .filter(Boolean);

    if (parts.length === 1) {

      return "#" + parts[0];

    }

    const peakRank = parts[0];
    const times = parts[1];

    return "#" + peakRank + " · " + times;

  }


  /*
   * ============================================================
   * API REQUEST
   * ============================================================
   */

  async function fetchAPI(params = "") {

    const separator = params ? "?" : "";

    const url = API_URL + separator + params;

    const response = await fetch(url, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {

      throw new Error(
        "API request failed: HTTP " + response.status
      );

    }

    const text = await response.text();

    let json;

    try {

      json = JSON.parse(text);

    } catch (error) {

      console.error("API returned:", text);

      throw new Error(
        "The chart API did not return valid JSON."
      );

    }

    if (!json.success) {

      throw new Error(
        json.error ||
        json.message ||
        "The chart API returned an error."
      );

    }

    return json;

  }


  /*
   * ============================================================
   * LOAD AVAILABLE WEEKS
   * ============================================================
   */

  async function loadWeeks() {

    showLoading("Loading available chart weeks...");

    try {

      const data = await fetchAPI("chart=hot100");

      const weeks = Array.isArray(data.availableWeeks)
        ? data.availableWeeks
        : [];

      if (!weeks.length) {

        throw new Error(
          "No chart weeks were returned by the API."
        );

      }

      weekSelect.innerHTML = "";

      /*
       * Newest week first.
       */

      weeks
        .slice()
        .sort()
        .reverse()
        .forEach(week => {

          const option = document.createElement("option");

          option.value = week;
          option.textContent = formatWeek(week);

          weekSelect.appendChild(option);

        });


      /*
       * Use the API's current week when available.
       */

      if (data.week) {

        weekSelect.value = data.week;

      }


      hideStatus();

      await loadChart(weekSelect.value);

    } catch (error) {

      console.error(error);

      showError(
        "Unable to load chart weeks. " +
        error.message
      );

      weekInfo.textContent = "Load failed";

    }

  }


  /*
   * ============================================================
   * LOAD CHART
   * ============================================================
   */

  async function loadChart(week) {

    showLoading("Loading Hot 100...");

    chartBody.innerHTML = "";

    try {

      const data = await fetchAPI(
        "chart=hot100&week=" +
        encodeURIComponent(week)
      );


      const rows = Array.isArray(data.data)
        ? data.data
        : [];


      if (!rows.length) {

        throw new Error(
          "No chart entries were returned for this week."
        );

      }


      renderChart(rows, data);


      hideStatus();

    } catch (error) {

      console.error(error);

      showError(
        "Unable to load Anoracharts. " +
        error.message
      );

      weekInfo.textContent = "Load failed";

    }

  }


  /*
   * ============================================================
   * RENDER CHART
   * ============================================================
   */

  function renderChart(rows, data) {

    chartBody.innerHTML = "";


    rows.forEach((row, index) => {

      /*
       * Support the actual Google Sheet/API field names.
       * Also support alternate capitalization so the site
       * remains robust if the sheet headers change slightly.
       */

      const rank =
        row.Rank ??
        row.rank ??
        index + 1;


      const previous =
        row.Prev ??
        row.Previous ??
        row["Previous Rank"] ??
        row.prev ??
        row.previous ??
        "";


      const song =
        row.Song ??
        row.song ??
        row.Title ??
        row.title ??
        "Unknown Song";


      const artist =
        row.Artist ??
        row.artist ??
        "Unknown Artist";


      const peak =
        row.Peak ??
        row.peak ??
        "";


      const weeks =
        row.Weeks ??
        row.WOC ??
        row["Weeks on Chart"] ??
        row.weeks ??
        row.woc ??
        "";


      const points =
        row["Weekly Points"] ??
        row.WeeklyPoints ??
        row.Points ??
        row.points ??
        0;


      const movement =
        getMovement(rank, previous);


      const tr = document.createElement("tr");


      tr.innerHTML = `

        <td class="rank">
          ${escapeHTML(rank)}
        </td>

        <td class="previous">
          ${previous
            ? escapeHTML(previous)
            : "—"}
        </td>

        <td class="movement ${movement.className}">
          ${escapeHTML(movement.text)}
        </td>

        <td class="song-cell">

          <div class="song-title">
            ${escapeHTML(song)}
          </div>

          <div class="artist-name">
            ${escapeHTML(artist)}
          </div>

        </td>

        <td class="peak">
          ${escapeHTML(formatPeak(peak))}
        </td>

        <td class="weeks">
          ${weeks
            ? escapeHTML(weeks)
            : "—"}
        </td>

        <td class="points">
          ${formatNumber(points)}
        </td>

      `;


      chartBody.appendChild(tr);

    });


    /*
     * Update week information.
     */

    const actualWeek =
      data.week ||
      weekSelect.value ||
      "—";


    chartDate.textContent =
      formatWeek(actualWeek);


    weekInfo.innerHTML =
      "<strong>" +
      rows.length +
      "</strong> songs · " +
      formatWeek(actualWeek);

  }


  /*
   * ============================================================
   * FORMAT WEEK
   * ============================================================
   */

  function formatWeek(dateString) {

    if (!dateString) {
      return "—";
    }

    /*
     * Keep ISO dates from the API predictable.
     */

    const parts = String(dateString).split("-");

    if (parts.length !== 3) {
      return dateString;
    }

    const year = Number(parts[0]);
    const month = Number(parts[1]);
    const day = Number(parts[2]);

    const date = new Date(
      year,
      month - 1,
      day
    );

    if (Number.isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    );

  }


  /*
   * ============================================================
   * WEEK SELECTOR
   * ============================================================
   */

  weekSelect.addEventListener(
    "change",
    function () {

      loadChart(this.value);

    }
  );


  /*
   * ============================================================
   * START ANORACHARTS
   * ============================================================
   */

  loadWeeks();

</script>

</body>
</html>
